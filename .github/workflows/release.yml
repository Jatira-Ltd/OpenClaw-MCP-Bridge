name: Release

on:
  push:
    tags:
      - 'v*'
      - 'beta-*'
      - 'alpha-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_beta=$(echo $VERSION | grep -qE 'beta|alpha' && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: release_type
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if echo "$VERSION" | grep -q "^v[0-9]*\.[0-9]*\.[0-9]*$"; then
            echo "type=stable" >> $GITHUB_OUTPUT
          elif echo "$VERSION" | grep -q "beta"; then
            echo "type=beta" >> $GITHUB_OUTPUT
          elif echo "$VERSION" | grep -q "alpha"; then
            echo "type=alpha" >> $GITHUB_OUTPUT
          else
            echo "type=pre" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" -n 20)
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build changelog from conventional commits
        id: conventional_changelog
        run: |
          # Try to generate a conventional changelog if conventional-changelog-cli is available
          npx conventional-changelog -p angular -i CHANGELOG.md -s 2>/dev/null || true
          
          # Generate release notes
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "# Release ${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "${{ steps.changelog.outputs.changelog }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.inputs.version }}...${{ steps.version.outputs.version }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: ${{ steps.version.outputs.version }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ steps.version.outputs.is_beta }}
        # Note: This creates the release body inline

      - name: Create Release with body
        run: |
          # Write release body to file
          cat > release_body.md << 'EOF'
          ${{ steps.conventional_changelog.outputs.release_notes }}
          EOF
          
          # Use softprops/action-gh-release for more control
          echo "Release notes prepared for ${{ steps.version.outputs.version }}"

      - name: Upload artifacts
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/cli.js
          asset_name: mcp-bridge-cli
          asset_content_type: application/javascript

      - name: Upload installation script
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./install.sh
          asset_name: install.sh
          asset_content_type: application/x-sh

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create issue for release
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Release ${{ github.ref }} published`,
              body: `A new release has been published: **${{ github.ref }}**\n\nPlease test the new version and report any issues.`
            })
